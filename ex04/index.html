<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Box Model: content-box vs border-box</h1>

    <div class="container">
        <div class="box content-box-demo">
            <h3>content-box</h3>
            <p>Width includes only the content. Padding and borders add to the total width.</p>
        </div>

        <div class="box border-box-demo">
            <h3>border-box</h3>
            <p>Width includes content, padding, and borders within the declared dimension.</p>
        </div>
    </div>
</body>
</html>
